name: "Deployment"

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.20"

jobs:
  build:
    name: Build the container image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Github Action
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}

  deploy:
    name: Deploy the container bot
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the container bot
        uses: appleboy/ssh-action@master
        env:
          CONTAINER_NAME: ticker-bot-fuiyoo
          CONFIG_VOLUME: crypto-discord-bot-config
          PRODUCTION_CONFIG: '${{ secrets.PRODUCTION_CONFIG }}'
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          key: ${{ secrets.PRODUCTION_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io --username ${{ github.actor }} --password-stdin
            docker stop ${{ env.CONTAINER_NAME }} || true && docker rm ${{ env.CONTAINER_NAME }} || true
            docker volume create ${{ env.CONFIG_VOLUME }}
            docker run --rm -v crypto-discord-bot-config:/config -e APP_CONFIG='${{ env.PRODUCTION_CONFIG }}' busybox sh -c 'echo "$APP_CONFIG" > /config/config.json'
            docker pull ${{ needs.build.outputs.tag }}
            docker run -d -v ${{ env.CONFIG_VOLUME }}:/config --name ${{ env.CONTAINER_NAME }} ${{ needs.build.outputs.tag }}

  tag:
    name: Create Git tag for deployment
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION file contains invalid semantic version format: '$VERSION'"
            echo "Expected format: X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          # Fetch latest tags from remote to minimize race condition window
          git fetch --tags
          
          VERSION=${{ steps.version.outputs.version }}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION}-${TIMESTAMP}-${SHORT_SHA}"
          
          # Check if tag already exists locally or remotely
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally, skipping creation"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Auto-tagged deployment at ${TIMESTAMP} (commit: ${SHORT_SHA})"
          
          # Push tag with error handling
          if git push origin "${TAG}"; then
            echo "Successfully created and pushed tag: ${TAG}"
          else
            echo "Error: Failed to push tag ${TAG}. The tag may already exist on remote or there may be a permissions issue."
            exit 1
          fi
