name: "Tag Release"

on:
  push:
    branches:
      - main

jobs:
  tag:
    name: Create Git tag for release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION file contains invalid semantic version format: '$VERSION'"
            echo "Expected format: X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          # Fetch latest tags from remote to minimize race condition window
          git fetch --tags
          
          VERSION=${{ steps.version.outputs.version }}
          TAG="v${VERSION}"
          
          # Check if tag already exists locally or remotely
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping creation"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          
          # Push tag with error handling
          if git push origin "${TAG}"; then
            echo "Successfully created and pushed tag: ${TAG}"
          else
            echo "Error: Failed to push tag ${TAG}. The tag may already exist on remote or there may be a permissions issue."
            exit 1
          fi
